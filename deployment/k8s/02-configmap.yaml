# Holds Non-sensitive config

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: microservices
data:
  # Database (non-sensitive parts)
  DB_NAME: "ncbaTest"
  DB_HOST: "mysql"
  DB_PORT: "3306"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Eureka
  EUREKA_SERVER: "http://eureka-server:8761/eureka/"

  # Spring profiles
  SPRING_PROFILES_ACTIVE: "k8s"

  # Actuator
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,gateway"

  #PORTS
  CRUD_SERVICE_PORT: "8087"
  EUREKA_SERVICE_PORT: "8761"
  GATEWAY_SERVICE_PORT: "8086"

  #WSDL
  WSDL_URL: "http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso"
