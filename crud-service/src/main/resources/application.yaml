server:
  port: ${CRUD_SERVICE_PORT:8087}

spring:
  application:
    name: crud-service

  # ─── Database ───
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true

  # ─── Redis ───
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  # ─── Cache ───
  cache:
    type: redis
    redis:
      time-to-live: 3600000      # 1 hour default TTL
      cache-null-values: false
      key-prefix: "crud:"
      use-key-prefix: true

# ─── SOAP Client ───
soap:
  client:
    country-info:
      endpoint-url: ${WSDL_URL:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}
      connect-timeout: 5000
      read-timeout: 10000

resilience4j:
  retry:
    instances:
      countrySoap:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - jakarta.xml.ws.WebServiceException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
        ignore-exceptions:
          - org.example.crudservice.exceptions.SoapException
          - org.example.crudservice.exceptions.ResourceNotFoundException

  circuitbreaker:
    instances:
      countrySoap:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - jakarta.xml.ws.WebServiceException
          - java.net.SocketTimeoutException
          - java.net.ConnectException

  # Bulkhead: limit concurrent calls (optional)
  bulkhead:
    instances:
      soapCountryInfo:
        max-concurrent-calls: 10
        max-wait-duration: 500ms

# ─── Logging ───
logging:
  level:
    io.github.resilience4j: INFO
    org.example.crudservice: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true