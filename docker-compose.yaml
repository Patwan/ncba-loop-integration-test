services:

  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "${EUREKA_SERVICE_PORT}:${EUREKA_SERVICE_PORT}"
    networks:
      - backend-network
    env_file:
      - .env.dev
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:${EUREKA_SERVICE_PORT}/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s


  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ncbaTest
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: unless-stopped
    ports:
      - "${CDBEAVER_PORT}:8978"
    networks:
      - backend-network
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
    environment:
      CB_SERVER_NAME: ${CLOUDBEAVER_SERVER_NAME}
      CB_ADMIN_NAME: ${CLOUDBEAVER_ADMIN}
      CB_ADMIN_PASSWORD: ${CLOUDBEAVER_PASSWORD}
      CB_ANONYMOUS_ACCESS: ${CLOUDBEAVER_ANONYMOUS_ACCESS}
      CB_HOME: ${CLOUDBEAVER_HOME}
    env_file:
      - .env.dev
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8978' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_SERVICE_PORT}:${GATEWAY_SERVICE_PORT}"
    env_file:
      - .env.dev
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      crud-service:
        condition: service_started
    networks:
      - backend-network

  crud-service:
    build:
      context: ./crud-service
      dockerfile: Dockerfile
    container_name: crud-service
    restart: unless-stopped
    ports:
      - "${CRUD_SERVICE_PORT:-8087}:8087"
    env_file:
      - .env.dev
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network


networks:
  backend-network:
    driver: bridge


volumes:
  mysql-data:
  redis-data:
  cloudbeaver-data: